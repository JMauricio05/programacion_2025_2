<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personas</title>
</head>
<body>
    <section>
        <div>
            <form name="personasForm">
                <div>
                    <label>Id:</label>
                    <input type="number" name="idInput">
                </div>
                <div>
                    <label>Nombre:</label>
                    <input type="text" name="nombreInput">
                </div>
                <div>
                    <label>Email:</label>
                    <input type="email" name="emailInput">
                </div>
                <div>
                    <label>Edad:</label>
                    <input type="number" name="edadInput">
                </div>
                <div>
                    <button type="submit">Guardar</button>
                    <button type="reset">Cancelar</button>
                </div>
            </form>
        </div>
        <div>
            <table id="personasTable">
                <thead>
                    <tr>
                        <td colspan="5">
                            <button>Crear</button>
                        </td>
                    </tr>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Edad</th>
                        <th>Operaciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="5">No hay datos</td>
                    </tr>
                    <tr>
                        <td>1</td>
                        <td>Pepe</td>
                        <td>pepe@test.com</td>
                        <td>32</td>
                        <td>
                            <button>Modificar</button>
                            <button>Eliminar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
    
    <script src="js/app_personas.js"></script>
</body>
</html>
